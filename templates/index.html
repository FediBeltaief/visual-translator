<!DOCTYPE html>
<html>
<head>
    <title>Visual Translator</title>
</head>
<body>
    <h2>Real-Time Visual Translator</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required>
        <button type="submit">Translate</button>
    </form>

    {% if image_path %}
        <h3>Uploaded Image:</h3>
        <img src="{{ image_path }}" width="350">
    {% endif %}

    {% if extracted %}
        <h3>Detected Text:</h3>
        <pre>{{ extracted }}</pre>
    {% endif %}

    {% if translated %}
        <h3>Translated Text:</h3>
        <pre>{{ translated }}</pre>
    {% endif %}

</body>
</html>
